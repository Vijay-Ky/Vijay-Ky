<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" width="100%" height="100%">
  <defs>
    <!-- White Card Background -->
    <linearGradient id="whiteCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="whiteBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#db2777" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="electricText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="45%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="softCardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <filter id="linkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <pattern id="lightDotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#64748b" fill-opacity="0.1"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', Consolas, Monaco, 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

    /* GSAP Spring Nudging Arrow */
    @keyframes springNudge {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(8px); }
    }
    .arrow-spring { animation: springNudge 1.4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }

    /* Floating Sparkle Animation */
    @keyframes sparkleTwinkle {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.5; }
      50% { transform: scale(1.4) rotate(45deg); opacity: 1; }
    }
    .sparkle-1 { transform-origin: 300px 40px; animation: sparkleTwinkle 2.5s infinite; }
    .sparkle-2 { transform-origin: 60px 180px; animation: sparkleTwinkle 3s 1s infinite; }

    /* Card Hover Motion */
    @keyframes cardFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    .card-float1 { animation: cardFloat 4s ease-in-out infinite; }
    .card-float2 { animation: cardFloat 4s 1s ease-in-out infinite; }
    .card-float3 { animation: cardFloat 4s 2s ease-in-out infinite; }
  </style>

  <!-- Card Base -->
  <rect width="920" height="230" rx="18" fill="url(#whiteCardBg)" filter="url(#softCardShadow)"/>
  <rect width="920" height="230" rx="18" fill="url(#lightDotGrid)"/>
  <rect width="918" height="228" x="1" y="1" rx="17" fill="none" stroke="url(#whiteBorderGrad)" stroke-width="1.4"/>

  <!-- ================= LEFT: NEON SIGN & INVITATION ================= -->
  <g transform="translate(36, 30)">
    <text x="0" y="12" fill="#2563eb" class="mono" font-size="11" font-weight="800" letter-spacing="1.5">INITIATE TRANSMISSION // CONNECT</text>

    <!-- Kinetic Headline -->
    <text x="0" y="58" fill="url(#electricText)" class="sans" font-size="34" font-weight="900" letter-spacing="-0.5">Let's Build Together.</text>

    <text x="0" y="94" fill="#334155" class="sans" font-size="13.5" line-height="20">
      <tspan x="0" dy="0">Open for entrepreneurial ventures, high-impact</tspan>
      <tspan x="0" dy="20">full stack engineering leadership, and cloud consulting.</tspan>
    </text>

    <g transform="translate(0, 142)">
      <rect width="186" height="28" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="16" y="18.5" fill="#1d4ed8" class="mono" font-size="11" font-weight="700">EXPLORE CHANNELS</text>
      <text x="160" y="19" fill="#2563eb" font-size="15" font-weight="800" class="arrow-spring">→</text>
    </g>

    <!-- Sparkles -->
    <path d="M300 35 L303 45 L313 48 L303 51 L300 61 L297 51 L287 48 L297 45 Z" fill="#2563eb" class="sparkle-1"/>
    <path d="M50 175 L52 181 L58 183 L52 185 L50 191 L48 185 L42 183 L48 181 Z" fill="#db2777" class="sparkle-2"/>
  </g>

  <!-- ================= RIGHT: INTERACTIVE CARDS ================= -->
  <g transform="translate(420, 24)">
    <!-- 1. LINKEDIN CARD -->
    <g transform="translate(0, 0)" class="card-float1">
      <rect width="460" height="52" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#linkShadow)"/>
      <rect x="12" y="10" width="32" height="32" rx="8" fill="#0a66c2"/>
      <path d="M22 20h3v10h-3V20zm1.5-5a1.75 1.75 0 1 1 0 3.5 1.75 1.75 0 0 1 0-3.5zM27 20h2.9v1.4h.04c.4-.76 1.38-1.56 2.85-1.56 3.05 0 3.61 2 3.61 4.62V30h-3v-4.8c0-1.14-.02-2.62-1.6-2.62-1.6 0-1.85 1.25-1.85 2.54V30h-3V20z" fill="#ffffff"/>
      
      <text x="56" y="24" fill="#0f172a" class="sans" font-size="13.5" font-weight="700">LinkedIn Professional Network</text>
      <text x="56" y="39" fill="#475569" class="mono" font-size="10.5">Vijay Kumar K Y • Connect &amp; Network</text>

      <g transform="translate(430, 31)">
        <text x="0" y="0" fill="#0a66c2" font-size="16" font-weight="800" class="arrow-spring">→</text>
      </g>
    </g>

    <!-- 2. EMAIL COLLAB CARD -->
    <g transform="translate(0, 60)" class="card-float2">
      <rect width="460" height="52" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#linkShadow)"/>
      <rect x="12" y="10" width="32" height="32" rx="8" fill="#ea4335"/>
      <path d="M20 20h16c1.1 0 2 .9 2 2v10c0 1.1-.9 2-2 2H20c-1.1 0-2-.9-2-2V22c0-1.1.9-2 2-2zm0 2l8 5 8-5H20zm16 10V24.5l-8 5-8-5V32h16z" fill="#ffffff" transform="translate(0, -3)"/>
      
      <text x="56" y="24" fill="#0f172a" class="sans" font-size="13.5" font-weight="700">Direct Email Transmission</text>
      <text x="56" y="39" fill="#475569" class="mono" font-size="10.5">vijayky007@gmail.com • Quick Response</text>

      <g transform="translate(430, 31)">
        <text x="0" y="0" fill="#ea4335" font-size="16" font-weight="800" class="arrow-spring">→</text>
      </g>
    </g>

    <!-- 3. GITHUB REPOSITORY CARD -->
    <g transform="translate(0, 120)" class="card-float3">
      <rect width="460" height="52" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#linkShadow)"/>
      <rect x="12" y="10" width="32" height="32" rx="8" fill="#0f172a"/>
      <path d="M28 17c-4.4 0-8 3.6-8 8 0 3.5 2.3 6.5 5.5 7.6.4.1.5-.2.5-.4v-1.4c-2.2.5-2.7-1.1-2.7-1.1-.4-.9-.9-1.2-.9-1.2-.7-.5.1-.5.1-.5.8.1 1.2.8 1.2.8.7 1.2 1.9.9 2.4.7.1-.5.3-.9.5-1.1-1.8-.2-3.7-.9-3.7-4 0-.9.3-1.6.8-2.2 0-.2-.4-1 .1-2.2 0 0 .7-.2 2.3.9.7-.2 1.4-.3 2.1-.3.7 0 1.4.1 2.1.3 1.6-1.1 2.3-.9 2.3-.9.5 1.2.1 2 .1 2.2.5.6.8 1.3.8 2.2 0 3.1-1.9 3.8-3.7 4 .3.3.6.8.6 1.6v2.4c0 .2.2.5.5.4 3.2-1.1 5.5-4.1 5.5-7.6 0-4.4-3.6-8-8-8z" fill="#ffffff" transform="translate(0, -3)"/>
      
      <text x="56" y="24" fill="#0f172a" class="sans" font-size="13.5" font-weight="700">GitHub Open Source Hub</text>
      <text x="56" y="39" fill="#475569" class="mono" font-size="10.5">github.com/Vijay-Ky • Repositories &amp; Commits</text>

      <g transform="translate(430, 31)">
        <text x="0" y="0" fill="#2563eb" font-size="16" font-weight="800" class="arrow-spring">→</text>
      </g>
    </g>
  </g>
</svg>