<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" width="100%" height="100%">
  <defs>
    <!-- Backgrounds -->
    <linearGradient id="connBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d17"/>
      <stop offset="50%" stop-color="#0e1122"/>
      <stop offset="100%" stop-color="#141126"/>
    </linearGradient>

    <linearGradient id="auroraBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="neonText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" fill-opacity="0.08"/>
    </pattern>

    <filter id="neonBlur">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', Consolas, Monaco, 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

    /* Nudging Arrow Animation */
    @keyframes nudge {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(6px); }
    }
    .arrow-nudge { animation: nudge 1.5s ease-in-out infinite; }

    /* Neon Sign Pulse */
    @keyframes neonGlow {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 1; filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.6)); }
    }
    .neon-pulse { animation: neonGlow 3s ease-in-out infinite; }

    /* Sparkle twinkle */
    @keyframes twinkle {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.4); opacity: 1; }
    }
    .sparkle-1 { transform-origin: 300px 40px; animation: twinkle 2.5s infinite; }
    .sparkle-2 { transform-origin: 60px 180px; animation: twinkle 3s 1s infinite; }
  </style>

  <!-- Card Base -->
  <rect width="920" height="230" rx="18" fill="url(#connBg)"/>
  <rect width="920" height="230" rx="18" fill="url(#dotGrid)"/>
  <rect width="918" height="228" x="1" y="1" rx="17" fill="none" stroke="url(#auroraBorder)" stroke-width="1.2"/>

  <!-- ================= LEFT: NEON SIGN & INVITATION ================= -->
  <g transform="translate(36, 30)">
    <!-- Top label -->
    <text x="0" y="12" fill="#22d3ee" class="mono" font-size="11" font-weight="700" letter-spacing="1.5">INITIATE TRANSMISSION // CONNECT</text>

    <!-- Glowing Handwritten Sign -->
    <text x="0" y="58" fill="url(#neonText)" class="sans neon-pulse" font-size="34" font-weight="900" letter-spacing="-0.5">Let's Build Together.</text>

    <!-- Pitch / Description -->
    <text x="0" y="94" fill="#cbd5e1" class="sans" font-size="13.5" line-height="20">
      <tspan x="0" dy="0">Open for entrepreneurial ventures, high-impact</tspan>
      <tspan x="0" dy="20">full stack engineering roles, and tech consulting.</tspan>
    </text>

    <!-- Pointing / Call to action Indicator -->
    <g transform="translate(0, 142)">
      <rect width="180" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.8"/>
      <text x="14" y="17" fill="#a78bfa" class="mono" font-size="10.5" font-weight="700">EXPLORE CHANNELS</text>
      <text x="155" y="18" fill="#22d3ee" font-size="14" class="arrow-nudge">→</text>
    </g>

    <!-- Sparkles -->
    <path d="M300 35 L303 45 L313 48 L303 51 L300 61 L297 51 L287 48 L297 45 Z" fill="#22d3ee" class="sparkle-1"/>
    <path d="M50 175 L52 181 L58 183 L52 185 L50 191 L48 185 L42 183 L48 181 Z" fill="#f472b6" class="sparkle-2"/>
  </g>

  <!-- ================= RIGHT: INTERACTIVE CARDS ================= -->
  <g transform="translate(420, 24)">
    <!-- 1. LINKEDIN CARD -->
    <g transform="translate(0, 0)">
      <rect width="460" height="52" rx="12" fill="#0f1325" stroke="#1e293b" stroke-width="1"/>
      <!-- LinkedIn Icon Badge -->
      <rect x="12" y="10" width="32" height="32" rx="8" fill="#0a66c2"/>
      <path d="M22 20h3v10h-3V20zm1.5-5a1.75 1.75 0 1 1 0 3.5 1.75 1.75 0 0 1 0-3.5zM27 20h2.9v1.4h.04c.4-.76 1.38-1.56 2.85-1.56 3.05 0 3.61 2 3.61 4.62V30h-3v-4.8c0-1.14-.02-2.62-1.6-2.62-1.6 0-1.85 1.25-1.85 2.54V30h-3V20z" fill="#ffffff"/>
      
      <!-- Text details -->
      <text x="56" y="24" fill="#f8fafc" class="sans" font-size="13" font-weight="600">LinkedIn Profile</text>
      <text x="56" y="38" fill="#94a3b8" class="mono" font-size="10.5">Vijay Kumar K Y • Connect &amp; Network</text>

      <!-- Nudging Arrow -->
      <g transform="translate(430, 31)">
        <text x="0" y="0" fill="#22d3ee" font-size="16" font-weight="700" class="arrow-nudge">→</text>
      </g>
    </g>

    <!-- 2. EMAIL COLLAB CARD -->
    <g transform="translate(0, 60)">
      <rect width="460" height="52" rx="12" fill="#0f1325" stroke="#1e293b" stroke-width="1"/>
      <!-- Mail Icon Badge -->
      <rect x="12" y="10" width="32" height="32" rx="8" fill="#ea4335"/>
      <path d="M20 20h16c1.1 0 2 .9 2 2v10c0 1.1-.9 2-2 2H20c-1.1 0-2-.9-2-2V22c0-1.1.9-2 2-2zm0 2l8 5 8-5H20zm16 10V24.5l-8 5-8-5V32h16z" fill="#ffffff" transform="translate(0, -3)"/>
      
      <!-- Text details -->
      <text x="56" y="24" fill="#f8fafc" class="sans" font-size="13" font-weight="600">Direct Email Transmission</text>
      <text x="56" y="38" fill="#94a3b8" class="mono" font-size="10.5">vijayky007@gmail.com • Quick Response</text>

      <!-- Nudging Arrow -->
      <g transform="translate(430, 31)">
        <text x="0" y="0" fill="#a78bfa" font-size="16" font-weight="700" class="arrow-nudge">→</text>
      </g>
    </g>

    <!-- 3. GITHUB REPOSITORY CARD -->
    <g transform="translate(0, 120)">
      <rect width="460" height="52" rx="12" fill="#0f1325" stroke="#1e293b" stroke-width="1"/>
      <!-- GitHub Icon Badge -->
      <rect x="12" y="10" width="32" height="32" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <path d="M28 17c-4.4 0-8 3.6-8 8 0 3.5 2.3 6.5 5.5 7.6.4.1.5-.2.5-.4v-1.4c-2.2.5-2.7-1.1-2.7-1.1-.4-.9-.9-1.2-.9-1.2-.7-.5.1-.5.1-.5.8.1 1.2.8 1.2.8.7 1.2 1.9.9 2.4.7.1-.5.3-.9.5-1.1-1.8-.2-3.7-.9-3.7-4 0-.9.3-1.6.8-2.2 0-.2-.4-1 .1-2.2 0 0 .7-.2 2.3.9.7-.2 1.4-.3 2.1-.3.7 0 1.4.1 2.1.3 1.6-1.1 2.3-.9 2.3-.9.5 1.2.1 2 .1 2.2.5.6.8 1.3.8 2.2 0 3.1-1.9 3.8-3.7 4 .3.3.6.8.6 1.6v2.4c0 .2.2.5.5.4 3.2-1.1 5.5-4.1 5.5-7.6 0-4.4-3.6-8-8-8z" fill="#22d3ee" transform="translate(0, -3)"/>
      
      <!-- Text details -->
      <text x="56" y="24" fill="#f8fafc" class="sans" font-size="13" font-weight="600">GitHub Open Source Hub</text>
      <text x="56" y="38" fill="#94a3b8" class="mono" font-size="10.5">github.com/Vijay-Ky • Repositories &amp; Contributions</text>

      <!-- Nudging Arrow -->
      <g transform="translate(430, 31)">
        <text x="0" y="0" fill="#f472b6" font-size="16" font-weight="700" class="arrow-nudge">→</text>
      </g>
    </g>
  </g>
</svg>