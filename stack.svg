<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="100%">
  <defs>
    <!-- White Card Background -->
    <linearGradient id="whiteCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="whiteBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#db2777" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Glowing Reactor Core -->
    <radialGradient id="reactorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#60a5fa"/>
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softCardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <filter id="chipShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>

    <pattern id="lightDotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#64748b" fill-opacity="0.1"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', Consolas, Monaco, 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

    /* Orbital Rotations */
    @keyframes orbit1 { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes orbit2 { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }
    @keyframes orbit3 { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes moonOrbit { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    @keyframes pulseCore {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.18); opacity: 1; }
    }

    .core-pulse { transform-origin: 220px 200px; animation: pulseCore 3s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    .rot1 { transform-origin: 220px 200px; animation: orbit1 16s linear infinite; }
    .rot2 { transform-origin: 220px 200px; animation: orbit2 22s linear infinite; }
    .rot3 { transform-origin: 220px 200px; animation: orbit3 28s linear infinite; }
    .rot-moon { transform-origin: 0 0; animation: moonOrbit 4s linear infinite; }

    /* Staggered Chip Glow Pulse */
    @keyframes chipPulse1 { 0%, 100% { border-color: #cbd5e1; } 15% { border-color: #2563eb; stroke: #2563eb; } 30% { border-color: #cbd5e1; } }
    @keyframes chipPulse2 { 0%, 15% { border-color: #cbd5e1; } 30% { border-color: #7c3aed; stroke: #7c3aed; } 45% { border-color: #cbd5e1; } }
    @keyframes chipPulse3 { 0%, 30% { border-color: #cbd5e1; } 45% { border-color: #db2777; stroke: #db2777; } 60% { border-color: #cbd5e1; } }
    @keyframes chipPulse4 { 0%, 45% { border-color: #cbd5e1; } 60% { border-color: #059669; stroke: #059669; } 75% { border-color: #cbd5e1; } }
    @keyframes chipPulse5 { 0%, 60% { border-color: #cbd5e1; } 75% { border-color: #0284c7; stroke: #0284c7; } 90% { border-color: #cbd5e1; } }

    .glow-1 { animation: chipPulse1 6s infinite; }
    .glow-2 { animation: chipPulse2 6s infinite; }
    .glow-3 { animation: chipPulse3 6s infinite; }
    .glow-4 { animation: chipPulse4 6s infinite; }
    .glow-5 { animation: chipPulse5 6s infinite; }
  </style>

  <!-- Card Base -->
  <rect width="920" height="400" rx="18" fill="url(#whiteCardBg)" filter="url(#softCardShadow)"/>
  <rect width="920" height="400" rx="18" fill="url(#lightDotGrid)"/>
  <rect width="918" height="398" x="1" y="1" rx="17" fill="none" stroke="url(#whiteBorderGrad)" stroke-width="1.4"/>

  <!-- ================= LEFT: 3D ORBITAL GYROSCOPE ================= -->
  <g>
    <!-- Orbital Guide Trails -->
    <ellipse cx="220" cy="200" rx="150" ry="58" fill="none" stroke="#2563eb" stroke-opacity="0.3" stroke-dasharray="4 6" stroke-width="1.2" transform="rotate(-28 220 200)"/>
    <ellipse cx="220" cy="200" rx="155" ry="58" fill="none" stroke="#7c3aed" stroke-opacity="0.3" stroke-dasharray="4 6" stroke-width="1.2" transform="rotate(38 220 200)"/>
    <ellipse cx="220" cy="200" rx="145" ry="58" fill="none" stroke="#db2777" stroke-opacity="0.3" stroke-dasharray="4 6" stroke-width="1.2" transform="rotate(82 220 200)"/>

    <!-- Central Glowing Core -->
    <circle cx="220" cy="200" r="44" fill="url(#reactorGlow)" class="core-pulse"/>
    <circle cx="220" cy="200" r="16" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#chipShadow)"/>
    <circle cx="220" cy="200" r="8" fill="#2563eb"/>

    <!-- Orbit 1: Java (Left) & Python (Right) -->
    <g class="rot1">
      <!-- Java -->
      <g transform="translate(70, 200)">
        <circle cx="0" cy="0" r="21" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" filter="url(#chipShadow)"/>
        <text x="0" y="6" font-size="18" text-anchor="middle">☕</text>
        <text x="0" y="31" fill="#1e40af" class="mono" font-size="9" font-weight="800" text-anchor="middle">JAVA</text>
      </g>
      <!-- Python -->
      <g transform="translate(370, 200)">
        <circle cx="0" cy="0" r="21" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" filter="url(#chipShadow)"/>
        <text x="0" y="6" font-size="18" text-anchor="middle">🐍</text>
        <text x="0" y="31" fill="#0369a1" class="mono" font-size="9" font-weight="800" text-anchor="middle">PYTHON</text>
      </g>
    </g>

    <!-- Orbit 2: React (Top) with Moons & TypeScript (Bottom) -->
    <g class="rot2">
      <!-- React -->
      <g transform="translate(220, 48)">
        <circle cx="0" cy="0" r="23" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8" filter="url(#chipShadow)"/>
        <text x="0" y="7" font-size="20" text-anchor="middle">⚛️</text>
        <text x="0" y="33" fill="#5b21b6" class="mono" font-size="9" font-weight="800" text-anchor="middle">REACT</text>

        <!-- Moons orbiting React -->
        <g class="rot-moon">
          <!-- Next.js -->
          <circle cx="28" cy="0" r="7" fill="#0f172a" stroke="#2563eb" stroke-width="1.2"/>
          <text x="28" y="2.5" fill="#ffffff" font-size="7" font-weight="900" class="mono" text-anchor="middle">N</text>
          <!-- Redux -->
          <circle cx="-28" cy="0" r="7" fill="#7c3aed" stroke="#ffffff" stroke-width="1.2"/>
          <text x="-28" y="2.5" fill="#ffffff" font-size="7" font-weight="900" class="mono" text-anchor="middle">R</text>
        </g>
      </g>

      <!-- TypeScript -->
      <g transform="translate(220, 352)">
        <circle cx="0" cy="0" r="21" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" filter="url(#chipShadow)"/>
        <text x="0" y="6" font-size="18" text-anchor="middle">🔷</text>
        <text x="0" y="31" fill="#1e40af" class="mono" font-size="9" font-weight="800" text-anchor="middle">TS</text>
      </g>
    </g>

    <!-- Orbit 3: Docker & Kubernetes -->
    <g class="rot3">
      <!-- Docker -->
      <g transform="translate(90, 110)">
        <circle cx="0" cy="0" r="21" fill="#ffffff" stroke="#db2777" stroke-width="1.8" filter="url(#chipShadow)"/>
        <text x="0" y="6" font-size="18" text-anchor="middle">🐳</text>
        <text x="0" y="31" fill="#9d174d" class="mono" font-size="9" font-weight="800" text-anchor="middle">DOCKER</text>
      </g>
      <!-- Kubernetes -->
      <g transform="translate(350, 290)">
        <circle cx="0" cy="0" r="21" fill="#ffffff" stroke="#db2777" stroke-width="1.8" filter="url(#chipShadow)"/>
        <text x="0" y="6" font-size="18" text-anchor="middle">☸️</text>
        <text x="0" y="31" fill="#9d174d" class="mono" font-size="9" font-weight="800" text-anchor="middle">K8S</text>
      </g>
    </g>

    <text x="220" y="380" fill="#64748b" class="mono" font-size="10.5" font-weight="700" letter-spacing="1.5" text-anchor="middle">TECH REVOLUTION ORBIT // DYNAMIC STACK</text>
  </g>

  <!-- ================= RIGHT: GROUPED CHIP GRID ================= -->
  <g transform="translate(470, 35)">
    <text x="0" y="14" fill="#2563eb" class="mono" font-size="11" font-weight="800" letter-spacing="1.5">STACK TAXONOMY &amp; ECOSYSTEM</text>

    <!-- CATEGORY 1: BACKEND ARCHITECTURE -->
    <g transform="translate(0, 32)">
      <text x="0" y="10" fill="#0f172a" class="sans" font-size="12" font-weight="700" letter-spacing="0.5">BACKEND &amp; SYSTEM ARCHITECTURE</text>
      <g transform="translate(0, 20)">
        <g transform="translate(0, 0)">
          <rect width="68" height="28" rx="7" fill="#ffffff" stroke="#cbd5e1" class="glow-1" stroke-width="1.4" filter="url(#chipShadow)"/>
          <text x="34" y="18" fill="#0f172a" class="mono" font-size="11" font-weight="700" text-anchor="middle">Java 21</text>
        </g>
        <g transform="translate(76, 0)">
          <rect width="75" height="28" rx="7" fill="#ffffff" stroke="#cbd5e1" class="glow-2" stroke-width="1.4" filter="url(#chipShadow)"/>
          <text x="37" y="18" fill="#0f172a" class="mono" font-size="11" font-weight="700" text-anchor="middle">Python 3</text>
        </g>
        <g transform="translate(159, 0)">
          <rect width="102" height="28" rx="7" fill="#ffffff" stroke="#cbd5e1" class="glow-3" stroke-width="1.4" filter="url(#chipShadow)"/>
          <text x="51" y="18" fill="#0f172a" class="mono" font-size="11" font-weight="700" text-anchor="middle">Spring Boot</text>
        </g>
        <g transform="translate(269, 0)">
          <rect width="92" height="28" rx="7" fill="#ffffff" stroke="#cbd5e1" class="glow-4" stroke-width="1.4" filter="url(#chipShadow)"/>
          <text x="46" y="18" fill="#0f172a" class="mono" font-size="11" font-weight="700" text-anchor="middle">PostgreSQL</text>
        </g>
        <g transform="translate(369, 0)">
          <rect width="52" height="28" rx="7" fill="#ffffff" stroke="#cbd5e1" class="glow-5" stroke-width="1.4" filter="url(#chipShadow)"/>
          <text x="26" y="18" fill="#0f172a" class="mono" font-size="11" font-weight="700" text-anchor="middle">REST</text>
        </g>
      </g>
    </g>

    <!-- CATEGORY 2: FRONTEND & MODERN WEB -->
    <g transform="translate(0, 122)">
      <text x="0" y="10" fill="#0f172a" class="sans" font-size="12" font-weight="700" letter-spacing="0.5">FRONTEND &amp; INTERACTIVE UI</text>
      <g transform="translate(0, 20)">
        <g transform="translate(0, 0)">
          <rect width="98" height="28" rx="7" fill="#ffffff" stroke="#cbd5e1" class="glow-2" stroke-width="1.4" filter="url(#chipShadow)"/>
          <text x="49" y="18" fill="#0f172a" class="mono" font-size="11" font-weight="700" text-anchor="middle">TypeScript</text>
        </g>
        <g transform="translate(106, 0)">
          <rect width="70" height="28" rx="7" fill="#ffffff" stroke="#cbd5e1" class="glow-3" stroke-width="1.4" filter="url(#chipShadow)"/>
          <text x="35" y="18" fill="#0f172a" class="mono" font-size="11" font-weight="700" text-anchor="middle">React.js</text>
        </g>
        <g transform="translate(184, 0)">
          <rect width="78" height="28" rx="7" fill="#ffffff" stroke="#cbd5e1" class="glow-4" stroke-width="1.4" filter="url(#chipShadow)"/>
          <text x="39" y="18" fill="#0f172a" class="mono" font-size="11" font-weight="700" text-anchor="middle">Next.js</text>
        </g>
        <g transform="translate(270, 0)">
          <rect width="88" height="28" rx="7" fill="#ffffff" stroke="#cbd5e1" class="glow-5" stroke-width="1.4" filter="url(#chipShadow)"/>
          <text x="44" y="18" fill="#0f172a" class="mono" font-size="11" font-weight="700" text-anchor="middle">Tailwind</text>
        </g>
        <g transform="translate(366, 0)">
          <rect width="55" height="28" rx="7" fill="#ffffff" stroke="#cbd5e1" class="glow-1" stroke-width="1.4" filter="url(#chipShadow)"/>
          <text x="27" y="18" fill="#0f172a" class="mono" font-size="11" font-weight="700" text-anchor="middle">State</text>
        </g>
      </g>
    </g>

    <!-- CATEGORY 3: CLOUD, CONTAINERS & DEVOPS -->
    <g transform="translate(0, 212)">
      <text x="0" y="10" fill="#0f172a" class="sans" font-size="12" font-weight="700" letter-spacing="0.5">CLOUD, CONTAINERS &amp; DEVOPS</text>
      <g transform="translate(0, 20)">
        <g transform="translate(0, 0)">
          <rect width="76" height="28" rx="7" fill="#ffffff" stroke="#cbd5e1" class="glow-3" stroke-width="1.4" filter="url(#chipShadow)"/>
          <text x="38" y="18" fill="#0f172a" class="mono" font-size="11" font-weight="700" text-anchor="middle">Docker</text>
        </g>
        <g transform="translate(84, 0)">
          <rect width="102" height="28" rx="7" fill="#ffffff" stroke="#cbd5e1" class="glow-4" stroke-width="1.4" filter="url(#chipShadow)"/>
          <text x="51" y="18" fill="#0f172a" class="mono" font-size="11" font-weight="700" text-anchor="middle">Kubernetes</text>
        </g>
        <g transform="translate(194, 0)">
          <rect width="90" height="28" rx="7" fill="#ffffff" stroke="#cbd5e1" class="glow-5" stroke-width="1.4" filter="url(#chipShadow)"/>
          <text x="45" y="18" fill="#0f172a" class="mono" font-size="11" font-weight="700" text-anchor="middle">CI/CD Flow</text>
        </g>
        <g transform="translate(292, 0)">
          <rect width="66" height="28" rx="7" fill="#ffffff" stroke="#cbd5e1" class="glow-1" stroke-width="1.4" filter="url(#chipShadow)"/>
          <text x="33" y="18" fill="#0f172a" class="mono" font-size="11" font-weight="700" text-anchor="middle">Linux</text>
        </g>
        <g transform="translate(366, 0)">
          <rect width="55" height="28" rx="7" fill="#ffffff" stroke="#cbd5e1" class="glow-2" stroke-width="1.4" filter="url(#chipShadow)"/>
          <text x="27" y="18" fill="#0f172a" class="mono" font-size="11" font-weight="700" text-anchor="middle">Git</text>
        </g>
      </g>
    </g>

    <!-- Bottom Badge -->
    <g transform="translate(0, 305)">
      <rect width="421" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="14" y="21" fill="#2563eb" class="mono" font-size="11" font-weight="700">🚀 Microservice Architecture • Cloud-Native Reliability</text>
    </g>
  </g>
</svg>