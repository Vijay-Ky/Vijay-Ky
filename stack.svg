<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="100%">
  <defs>
    <!-- Backgrounds -->
    <linearGradient id="stackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d17"/>
      <stop offset="50%" stop-color="#0e1122"/>
      <stop offset="100%" stop-color="#141126"/>
    </linearGradient>

    <linearGradient id="auroraBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="reactCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>

    <!-- Chip Glow Filter -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', Consolas, Monaco, 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

    /* Orbital Rotations */
    @keyframes orbit1 {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes orbit2 {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }
    @keyframes orbit3 {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes moonOrbit {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulseCore {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    .core-pulse { transform-origin: 220px 200px; animation: pulseCore 3s ease-in-out infinite; }
    .rot1 { transform-origin: 220px 200px; animation: orbit1 16s linear infinite; }
    .rot2 { transform-origin: 220px 200px; animation: orbit2 22s linear infinite; }
    .rot3 { transform-origin: 220px 200px; animation: orbit3 28s linear infinite; }
    .rot-moon { transform-origin: 0 0; animation: moonOrbit 4s linear infinite; }

    /* Sequential Chip Glowing */
    @keyframes glowChip1 { 0%, 100% { stroke: #334155; } 10% { stroke: #22d3ee; filter: url(#neonBlur); } 20% { stroke: #334155; } }
    @keyframes glowChip2 { 0%, 10% { stroke: #334155; } 20% { stroke: #a78bfa; filter: url(#neonBlur); } 30% { stroke: #334155; } }
    @keyframes glowChip3 { 0%, 20% { stroke: #334155; } 30% { stroke: #f472b6; filter: url(#neonBlur); } 40% { stroke: #334155; } }
    @keyframes glowChip4 { 0%, 30% { stroke: #334155; } 40% { stroke: #34d399; filter: url(#neonBlur); } 50% { stroke: #334155; } }
    @keyframes glowChip5 { 0%, 40% { stroke: #334155; } 50% { stroke: #38bdf8; filter: url(#neonBlur); } 60% { stroke: #334155; } }

    .chip-glow1 { animation: glowChip1 6s infinite; }
    .chip-glow2 { animation: glowChip2 6s infinite; }
    .chip-glow3 { animation: glowChip3 6s infinite; }
    .chip-glow4 { animation: glowChip4 6s infinite; }
    .chip-glow5 { animation: glowChip5 6s infinite; }
  </style>

  <!-- Card Base -->
  <rect width="920" height="400" rx="18" fill="url(#stackBg)"/>
  <rect width="920" height="400" rx="18" fill="url(#dotGrid)"/>
  <rect width="918" height="398" x="1" y="1" rx="17" fill="none" stroke="url(#auroraBorder)" stroke-width="1.2"/>

  <!-- ================= LEFT: 3D ORBITAL ATOM ================= -->
  <g>
    <!-- Background orbital guide trails (static tilted ellipses) -->
    <!-- Orbit 1: Tilted -28 deg -->
    <ellipse cx="220" cy="200" rx="150" ry="58" fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-dasharray="3 5" transform="rotate(-28 220 200)"/>
    <!-- Orbit 2: Tilted 38 deg -->
    <ellipse cx="220" cy="200" rx="155" ry="58" fill="none" stroke="#a78bfa" stroke-opacity="0.25" stroke-dasharray="3 5" transform="rotate(38 220 200)"/>
    <!-- Orbit 3: Tilted 82 deg -->
    <ellipse cx="220" cy="200" rx="145" ry="58" fill="none" stroke="#f472b6" stroke-opacity="0.25" stroke-dasharray="3 5" transform="rotate(82 220 200)"/>

    <!-- Central Glowing Core -->
    <circle cx="220" cy="200" r="38" fill="url(#coreGlow)" class="core-pulse"/>
    <circle cx="220" cy="200" r="14" fill="#ffffff" filter="url(#neonBlur)"/>
    <circle cx="220" cy="200" r="8" fill="#38bdf8"/>

    <!-- Dynamic Orbiting Bodies -->
    <!-- ORBIT 1: Java (Left) & Python (Right) -->
    <g class="rot1">
      <!-- Body 1: Java (☕) -->
      <g transform="translate(70, 200)">
        <circle cx="0" cy="0" r="19" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5" filter="url(#neonBlur)"/>
        <text x="0" y="6" font-size="18" text-anchor="middle">☕</text>
        <text x="0" y="29" fill="#38bdf8" class="mono" font-size="9" font-weight="700" text-anchor="middle">JAVA</text>
      </g>
      <!-- Body 2: Python (🐍) -->
      <g transform="translate(370, 200)">
        <circle cx="0" cy="0" r="19" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#neonBlur)"/>
        <text x="0" y="6" font-size="18" text-anchor="middle">🐍</text>
        <text x="0" y="29" fill="#38bdf8" class="mono" font-size="9" font-weight="700" text-anchor="middle">PYTHON</text>
      </g>
    </g>

    <!-- ORBIT 2: React (⚛️) & TypeScript (🔷) -->
    <g class="rot2">
      <!-- Body 3: React + Moons -->
      <g transform="translate(220, 48)">
        <circle cx="0" cy="0" r="21" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5" filter="url(#neonBlur)"/>
        <text x="0" y="7" font-size="20" text-anchor="middle">⚛️</text>
        <text x="0" y="31" fill="#c084fc" class="mono" font-size="9" font-weight="700" text-anchor="middle">REACT</text>

        <!-- Two small moons orbiting React -->
        <g class="rot-moon">
          <!-- Moon 1: Next.js -->
          <circle cx="26" cy="0" r="6" fill="#030712" stroke="#22d3ee" stroke-width="1"/>
          <text x="26" y="2" fill="#22d3ee" font-size="6" font-weight="900" class="mono" text-anchor="middle">N</text>
          <!-- Moon 2: Redux -->
          <circle cx="-26" cy="0" r="6" fill="#030712" stroke="#f472b6" stroke-width="1"/>
          <text x="-26" y="2" fill="#f472b6" font-size="6" font-weight="900" class="mono" text-anchor="middle">R</text>
        </g>
      </g>
      <!-- Body 4: TypeScript -->
      <g transform="translate(220, 352)">
        <circle cx="0" cy="0" r="19" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" filter="url(#neonBlur)"/>
        <text x="0" y="6" font-size="18" text-anchor="middle">🔷</text>
        <text x="0" y="29" fill="#c084fc" class="mono" font-size="9" font-weight="700" text-anchor="middle">TS</text>
      </g>
    </g>

    <!-- ORBIT 3: Docker (🐳) & Kubernetes (☸️) -->
    <g class="rot3">
      <!-- Body 5: Docker -->
      <g transform="translate(90, 110)">
        <circle cx="0" cy="0" r="19" fill="#0f172a" stroke="#f472b6" stroke-width="1.5" filter="url(#neonBlur)"/>
        <text x="0" y="6" font-size="18" text-anchor="middle">🐳</text>
        <text x="0" y="29" fill="#f472b6" class="mono" font-size="9" font-weight="700" text-anchor="middle">DOCKER</text>
      </g>
      <!-- Body 6: Kubernetes -->
      <g transform="translate(350, 290)">
        <circle cx="0" cy="0" r="19" fill="#0f172a" stroke="#f472b6" stroke-width="1.5" filter="url(#neonBlur)"/>
        <text x="0" y="6" font-size="18" text-anchor="middle">☸️</text>
        <text x="0" y="29" fill="#f472b6" class="mono" font-size="9" font-weight="700" text-anchor="middle">K8S</text>
      </g>
    </g>

    <!-- Atom Label -->
    <text x="220" y="380" fill="#64748b" class="mono" font-size="10.5" font-weight="600" letter-spacing="1.5" text-anchor="middle">TECH REVOLUTION ORBIT // DYNAMIC STACK</text>
  </g>

  <!-- ================= RIGHT: GROUPED CHIP GRID ================= -->
  <g transform="translate(470, 35)">
    <!-- Header -->
    <text x="0" y="14" fill="#22d3ee" class="mono" font-size="11" font-weight="700" letter-spacing="1.5">STACK TAXONOMY &amp; ECOSYSTEM</text>

    <!-- CATEGORY 1: BACKEND & DISTRIBUTED SYSTEMS -->
    <g transform="translate(0, 32)">
      <text x="0" y="10" fill="#94a3b8" class="sans" font-size="12" font-weight="700" letter-spacing="0.5">BACKEND &amp; SYSTEM ARCHITECTURE</text>
      <g transform="translate(0, 20)">
        <!-- Chip: Java -->
        <g transform="translate(0, 0)">
          <rect width="68" height="28" rx="7" fill="#11152a" class="chip-glow1" stroke-width="1.2"/>
          <text x="34" y="18" fill="#e2e8f0" class="mono" font-size="11" font-weight="600" text-anchor="middle">Java 21</text>
        </g>
        <!-- Chip: Python -->
        <g transform="translate(76, 0)">
          <rect width="75" height="28" rx="7" fill="#11152a" class="chip-glow2" stroke-width="1.2"/>
          <text x="37" y="18" fill="#e2e8f0" class="mono" font-size="11" font-weight="600" text-anchor="middle">Python 3</text>
        </g>
        <!-- Chip: Spring Boot -->
        <g transform="translate(159, 0)">
          <rect width="102" height="28" rx="7" fill="#11152a" class="chip-glow3" stroke-width="1.2"/>
          <text x="51" y="18" fill="#e2e8f0" class="mono" font-size="11" font-weight="600" text-anchor="middle">Spring Boot</text>
        </g>
        <!-- Chip: PostgreSQL -->
        <g transform="translate(269, 0)">
          <rect width="92" height="28" rx="7" fill="#11152a" class="chip-glow4" stroke-width="1.2"/>
          <text x="46" y="18" fill="#e2e8f0" class="mono" font-size="11" font-weight="600" text-anchor="middle">PostgreSQL</text>
        </g>
        <!-- Chip: Microservices -->
        <g transform="translate(369, 0)">
          <rect width="52" height="28" rx="7" fill="#11152a" class="chip-glow5" stroke-width="1.2"/>
          <text x="26" y="18" fill="#e2e8f0" class="mono" font-size="11" font-weight="600" text-anchor="middle">REST</text>
        </g>
      </g>
    </g>

    <!-- CATEGORY 2: FRONTEND & MODERN WEB -->
    <g transform="translate(0, 122)">
      <text x="0" y="10" fill="#94a3b8" class="sans" font-size="12" font-weight="700" letter-spacing="0.5">FRONTEND &amp; INTERACTIVE UI</text>
      <g transform="translate(0, 20)">
        <!-- Chip: TypeScript -->
        <g transform="translate(0, 0)">
          <rect width="98" height="28" rx="7" fill="#11152a" class="chip-glow2" stroke-width="1.2"/>
          <text x="49" y="18" fill="#e2e8f0" class="mono" font-size="11" font-weight="600" text-anchor="middle">TypeScript</text>
        </g>
        <!-- Chip: React -->
        <g transform="translate(106, 0)">
          <rect width="70" height="28" rx="7" fill="#11152a" class="chip-glow3" stroke-width="1.2"/>
          <text x="35" y="18" fill="#e2e8f0" class="mono" font-size="11" font-weight="600" text-anchor="middle">React.js</text>
        </g>
        <!-- Chip: Next.js -->
        <g transform="translate(184, 0)">
          <rect width="78" height="28" rx="7" fill="#11152a" class="chip-glow4" stroke-width="1.2"/>
          <text x="39" y="18" fill="#e2e8f0" class="mono" font-size="11" font-weight="600" text-anchor="middle">Next.js</text>
        </g>
        <!-- Chip: Tailwind CSS -->
        <g transform="translate(270, 0)">
          <rect width="88" height="28" rx="7" fill="#11152a" class="chip-glow5" stroke-width="1.2"/>
          <text x="44" y="18" fill="#e2e8f0" class="mono" font-size="11" font-weight="600" text-anchor="middle">Tailwind</text>
        </g>
        <!-- Chip: Redux -->
        <g transform="translate(366, 0)">
          <rect width="55" height="28" rx="7" fill="#11152a" class="chip-glow1" stroke-width="1.2"/>
          <text x="27" y="18" fill="#e2e8f0" class="mono" font-size="11" font-weight="600" text-anchor="middle">State</text>
        </g>
      </g>
    </g>

    <!-- CATEGORY 3: CLOUD, CONTAINERS & DEVOPS -->
    <g transform="translate(0, 212)">
      <text x="0" y="10" fill="#94a3b8" class="sans" font-size="12" font-weight="700" letter-spacing="0.5">CLOUD, CONTAINERS &amp; DEVOPS</text>
      <g transform="translate(0, 20)">
        <!-- Chip: Docker -->
        <g transform="translate(0, 0)">
          <rect width="76" height="28" rx="7" fill="#11152a" class="chip-glow3" stroke-width="1.2"/>
          <text x="38" y="18" fill="#e2e8f0" class="mono" font-size="11" font-weight="600" text-anchor="middle">Docker</text>
        </g>
        <!-- Chip: Kubernetes -->
        <g transform="translate(84, 0)">
          <rect width="102" height="28" rx="7" fill="#11152a" class="chip-glow4" stroke-width="1.2"/>
          <text x="51" y="18" fill="#e2e8f0" class="mono" font-size="11" font-weight="600" text-anchor="middle">Kubernetes</text>
        </g>
        <!-- Chip: CI/CD -->
        <g transform="translate(194, 0)">
          <rect width="90" height="28" rx="7" fill="#11152a" class="chip-glow5" stroke-width="1.2"/>
          <text x="45" y="18" fill="#e2e8f0" class="mono" font-size="11" font-weight="600" text-anchor="middle">CI/CD Flow</text>
        </g>
        <!-- Chip: Linux -->
        <g transform="translate(292, 0)">
          <rect width="66" height="28" rx="7" fill="#11152a" class="chip-glow1" stroke-width="1.2"/>
          <text x="33" y="18" fill="#e2e8f0" class="mono" font-size="11" font-weight="600" text-anchor="middle">Linux</text>
        </g>
        <!-- Chip: Git -->
        <g transform="translate(366, 0)">
          <rect width="55" height="28" rx="7" fill="#11152a" class="chip-glow2" stroke-width="1.2"/>
          <text x="27" y="18" fill="#e2e8f0" class="mono" font-size="11" font-weight="600" text-anchor="middle">Git</text>
        </g>
      </g>
    </g>

    <!-- Bottom Architecture Quote -->
    <g transform="translate(0, 305)">
      <rect width="421" height="34" rx="8" fill="#13172c" stroke="#1e293b" stroke-width="0.8"/>
      <text x="14" y="21" fill="#38bdf8" class="mono" font-size="11">🚀 Microservice Architecture • Cloud-Native Reliability</text>
    </g>
  </g>
</svg>